<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Video Downloader</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath stroke='%235A6CF3' stroke-width='2' fill='none' stroke-linecap='round' d='M12 3v12M6 10l6 6 6-6M4 20h16'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <main id="content"></main>

    <nav class="navbar">
      <div class="nav-container">
        <button class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
            <path d="M9 21v-7h6v7"/>
          </svg>
          <span class="nav-label">Home</span>
        </button>

        <button class="nav-item" data-view="downloads">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1E2430" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>
          </svg>
        </button>

        <button class="nav-item" data-view="profile">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1E2430" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="7" r="4"/>
            <path d="M4 21c0-4.5 3.5-7 8-7s8 2.5 8 7"/>
          </svg>
        </button>

        <button class="nav-item" data-view="apps">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1E2430" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="6" height="6"/>
            <rect x="14" y="4" width="6" height="6"/>
            <rect x="4" y="14" width="6" height="6"/>
            <rect x="14" y="14" width="6" height="6"/>
          </svg>
        </button>
      </div>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
